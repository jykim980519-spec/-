# Streamlit 설정 (로컬 실행과 Streamlit Cloud 모두 이 파일을 읽는다)
# 색은 WCAG AA 기준(글자 4.5:1, 체크박스 같은 UI 요소 3:1)에 맞춰 골랐다.
# 확인: npm run test:streamlit -- -g "색 대비"

[browser]
gatherUsageStats = false

# 라이트·다크 테마를 모두 정의하면 사용자 기기 설정(prefers-color-scheme)을 따른다.
[theme.light]
# [추가]·[저장]·[지우기] 버튼 배경, 체크된 체크박스, 포커스 테두리
# 흰 글자와 6.1:1
primaryColor = "#237032"
# 체크한 아이템 이름(:gray[]): 흰 배경과 약 4.9:1, 일반 글자보다는 흐리게
grayTextColor = "#6b7080"

[theme.dark]
# 흰 글자와 6.1:1, 어두운 배경(#0e1117)과 3.1:1
primaryColor = "#237032"
